<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Crude oil leakage detection system</title>
  <desc id="desc">A pipeline monitoring illustration with turbidity and flow sensors.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b2b"/><stop offset="1" stop-color="#123c47"/></linearGradient></defs>
  <rect width="1200" height="800" fill="url(#bg)"/><path d="M80 470h1040" stroke="#d7a84b" stroke-width="46" stroke-linecap="round"/><path d="M80 470h1040" stroke="#f4d27b" stroke-width="5" stroke-dasharray="22 20"/>
  <circle cx="355" cy="470" r="55" fill="#0b2938" stroke="#38d6b0" stroke-width="8"/><circle cx="355" cy="470" r="18" fill="#38d6b0"/><circle cx="850" cy="470" r="55" fill="#0b2938" stroke="#ff715b" stroke-width="8"/><path d="M850 440v60M820 470h60" stroke="#ff715b" stroke-width="8"/>
