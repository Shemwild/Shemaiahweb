  <rect x="540" y="620" width="220" height="90" rx="14" fill="#3a2226" stroke="#ff715b" stroke-width="3"/><text x="570" y="660" fill="#ffe3dc" font-family="sans-serif" font-size="25">FLOW SENSOR</text><text x="570" y="690" fill="#ff9a88" font-family="monospace" font-size="23">STABLE</text>
  <text x="80" y="105" fill="#effffb" font-family="sans-serif" font-size="43" font-weight="700">PIPELINE INTEGRITY</text><text x="84" y="145" fill="#8bc8c2" font-family="sans-serif" font-size="23">REAL-TIME ENVIRONMENTAL MONITORING</text>
